<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Washing Machine with Cat</title>
  <!-- นำเข้า A-Frame และ AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    /* สไตล์สำหรับปุ่มควบคุมด้านบนหน้าจอ */
    .ui-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 20px;
      border-radius: 30px;
    }
    
    .btn {
      background-color: #ffffff;
      color: #333;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
      background-color: #ddd;
    }

    .btn-stop {
      background-color: #ff4d4d;
      color: white;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- ส่วนควบคุม UI ปุ่มกด -->
  <div class="ui-container">
    <button class="btn btn-stop" onclick="setSpeed(0)">หยุด</button>
    <button class="btn" onclick="setSpeed(3000)">หมุนช้า</button>
    <button class="btn" onclick="setSpeed(1000)">ปานกลาง</button>
    <button class="btn" onclick="setSpeed(300)">หมุนเร็ว</button>
  </div>

  <!-- A-Frame AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Hiro Marker -->
    <a-marker preset="hiro">
      
      <!-- กลุ่มวัตถุทั้งหมด (เครื่องซักผ้า + แมว) -->
      <a-entity position="0 0 0" scale="0.8 0.8 0.8">
        
        <!-- === ตัวเครื่องซักผ้าสีขาว (Main Body) === -->
        <a-box position="0 0.6 0" width="1" height="1.2" depth="1" color="#FFFFFF" shadow></a-box>
        
        <!-- แผงควบคุมด้านบน -->
        <a-box position="0 1.1 0.46" width="0.9" height="0.12" depth="0.1" color="#E0E0E0"></a-box>
        <a-cylinder position="-0.25 1.1 0.52" radius="0.03" height="0.02" rotation="90 0 0" color="#333333"></a-cylinder>
        
        <!-- ขอบฝาหน้าเครื่องซักผ้า -->
        <a-torus position="0 0.5 0.51" radius="0.32" tube="0.03" color="#333333"></a-torus>
        
        <!-- กระจกฝาหน้า -->
        <a-cylinder position="0 0.5 0.51" radius="0.3" height="0.01" rotation="90 0 0" color="#88CCFF" opacity="0.4" transparent="true"></a-cylinder>

        <!-- === ถังซักผ้าผ้าด้านใน (ส่วนที่หมุนได้) === -->
        <a-entity id="drum" position="0 0.5 0.35">
          <!-- ตัวถังโลหะ -->
          <a-cylinder radius="0.28" height="0.3" rotation="90 0 0" color="#AAAAAA" side="double">
            <!-- เสื้อผ้า/ลวดลายภายในถังซักเพื่อให้เห็นการหมุนชัดเจน -->
            <a-box position="0.1 0.1 0" width="0.1" height="0.1" depth="0.1" color="#FF5722"></a-box>
            <a-box position="-0.1 -0.1 0" width="0.12" height="0.12" depth="0.1" color="#2196F3"></a-box>
            <a-box position="0 -0.12 0.05" width="0.08" height="0.08" depth="0.08" color="#4CAF50"></a-box>
          </a-cylinder>
        </a-entity>

        <!-- === แมวสีส้ม (อยู่บนเครื่องซักผ้า) === -->
        <a-entity position="0 1.2 0">
          <!-- ตัวแมว -->
          <a-box position="0 0.15 0" width="0.35" height="0.25" depth="0.45" color="#FF9800"></a-box>
          
          <!-- หัวแมว -->
          <a-box position="0 0.3 0.15" width="0.28" height="0.22" depth="0.25" color="#FF9800"></a-box>
          
          <!-- หูแมว 2 ข้าง -->
          <a-cone position="-0.09 0.44 0.15" radius-bottom="0.05" radius-top="0" height="0.1" color="#E65100"></a-cone>
          <a-cone position="0.09 0.44 0.15" radius-bottom="0.05" radius-top="0" height="0.1" color="#E65100"></a-cone>
          
          <!-- ตาแมว -->
          <a-sphere position="-0.07 0.33 0.28" radius="0.025" color="#000000"></a-sphere>
          <a-sphere position="0.07 0.33 0.28" radius="0.025" color="#000000"></a-sphere>
          
          <!-- จมูกแมว -->
          <a-sphere position="0 0.29 0.285" radius="0.015" color="#FF4081"></a-sphere>
          
          <!-- หางแมว -->
          <a-cylinder position="0 0.2 -0.25" radius="0.02" height="0.3" rotation="-45 0 0" color="#E65100"></a-cylinder>
        </a-entity>

      </a-entity>
    </a-marker>

    <!-- กล้องสำหรับ AR -->
    <a-entity camera></a-entity>
  </a-scene>

  <!-- สคริปต์ควบคุมการหมุน -->
  <script>
    const drum = document.getElementById('drum');

    // ฟังก์ชันปรับความเร็วการหมุนของถังซัก
    function setSpeed(dur) {
      // ลบ Animation เก่าออกก่อน
      drum.removeAttribute('animation');

      // ถ้ากำหนด dur > 0 ให้เพิ่ม animation การหมุนใหม่
      if (dur > 0) {
        drum.setAttribute('animation', {
          property: 'rotation',
          to: '0 0 -360', // หมุนรอบแกน Z
          loop: true,
          dur: dur,       // ระยะเวลาต่อ 1 รอบ (ยิ่งน้อยยิ่งเร็ว)
          easing: 'linear'
        });
      }
    }

    // เริ่มต้นให้หมุนความเร็วปานกลางเมื่อโหลดหน้าเว็บ
    window.onload = () => {
      setSpeed(1000);
    };
  </script>
</body>
</html>
